<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Digital clock | Self-Practice</title>
</head>

<body>
    <div class="heading">
        <h1>Digital Clock</h1>
    </div>

    <main class="container">
        <h1 class="day" id="day"></h1>
        <div class="box">
            <div class="clock">
                <div class="front-clock">
                    <div id="hour">00</div>
                    <div id="ampm">AM</div>
                    <p>hour</p>
                </div>
            </div>
            <div class="clock">
                <div class="front-clock">
                    <div id="minute">00</div>
                    <p>minutes</p>
                </div>
            </div>
            <div class="clock">
                <div class="front-clock">
                    <div id="second">00</div>
                    <p>second</p>
                </div>
            </div>


        </div>
    </main>
    <script src="app.js"></script>
</body>

</html>
